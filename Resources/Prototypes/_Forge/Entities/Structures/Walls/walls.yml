- type: entity
  parent: WallPlastitaniumIndestructible
  id: WallPlastitaniumColiseum
  name: plastitanium wall
  suffix: "Coliseum"
  components:
  - type: Tag
    tags:
    - Wall
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DeleteOnTrigger
  - type: SpawnOnTrigger
    proto: WallPlastitaniumShuttle
  - type: RepeatingTrigger
    delay: 60

- type: entity
  parent: WallPlastitaniumDiagonal
  id: WallPlastitaniumDiagonalColiseum
  name: plastitanium wall
  suffix: "diagonal, Coliseum"
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger: !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DeleteOnTrigger
  - type: SpawnOnTrigger
    proto: WallPlastitaniumDiagonal
  - type: RepeatingTrigger
    delay: 60

- type: entity
  parent: BaseWall
  id: WallWoodForced
  name: укреплённая деревянная стена
  description: Из более твёрдых сортов дерева.
  components:
  - type: Sprite
    sprite: Structures/Walls/wood.rsi
  - type: Icon
    sprite: Structures/Walls/wood.rsi
  - type: Construction
    graph: Barricade
    node: woodWall
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1800 # we take Mono wall balance, and im buff
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
    - trigger: !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:ChangeConstructionNodeBehavior
        node: Barricade
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: woods
    base: wood
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
